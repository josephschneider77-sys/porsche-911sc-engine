<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d5001c%22/%3E%3C/svg%3E" />
  <meta name="theme-color" content="#101114" />
  <title>911 SC 3.0 Engine</title>
  <meta name="description" content="Interactive, disassemblable 3D model of the 1978 Porsche 911 SC 3.0 air-cooled flat-six." />
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <header class="top">
      <div class="brand">
        <div class="title">911 SC <span>3.0</span></div>
        <div class="sub" id="variant-label">2994 cc flat-six</div>
      </div>
      <div class="top-actions">
        <button id="btn-parts" class="icon-btn" aria-label="Parts list" title="Parts list">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <button id="btn-reset" class="icon-btn" aria-label="Reset" title="Reset">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
        </button>
      </div>
    </header>

    <section id="info" class="card info hidden" aria-live="polite"></section>

    <aside id="parts" class="sheet parts hidden">
      <div class="sheet-head"><span>Parts <small id="parts-count"></small></span><button id="parts-close" class="icon-btn small" aria-label="Close">✕</button></div>
      <div id="parts-list" class="parts-list"></div>
    </aside>

    <footer class="dock card">
      <label class="emissions">
        <input id="emissions" type="checkbox" />
        <span>Emissions equipment</span>
      </label>
      <div class="row explode-row">
        <label for="explode">Explode</label>
        <input id="explode" type="range" min="0" max="100" value="0" />
        <span id="explode-val">0%</span>
      </div>
      <div class="row step-row">
        <button id="btn-back" class="step-btn" aria-label="Previous step">‹</button>
        <div class="step-text">
          <div id="step-title">Assembled engine</div>
          <div id="step-note">Tap “Disassemble” to follow the factory teardown order.</div>
        </div>
        <button id="btn-next" class="step-btn primary" aria-label="Next step">›</button>
      </div>
      <div class="progress"><div id="step-bar"></div></div>
    </footer>

    <div id="loader" class="loader"><div class="ring"></div><div id="load-text">Loading parts…</div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
